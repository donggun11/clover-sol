<!DOCTYPE html>
<html lang="en-us">
<head>
  <base href="https://cdn.jsdelivr.net/gh/web-ports/clover-pit@main/">
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>CloverPit Game</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  
  <style>
    /* 저장 상태 표시 UI 추가 */
    #save-status {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #00ffcc;
      padding: 8px 15px;
      border-radius: 5px;
      font-family: sans-serif;
      font-size: 14px;
      z-index: 9999;
    }
  </style>
</head>

<body>
  <div id="save-status">💾 데이터 자동 저장 활성화됨</div>

  <div id="loading-text" style="color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;">
    LOADING...
  </div>

  <div id="unity-container">
    <canvas id="unity-canvas" width="960" height="540" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"></div>
  </div>

  <script>
    // ============================================================
    // 💾 LOCALSTORAGE 데이터 저장 및 불러오기 시스템
    // ============================================================
    const SAVE_KEY = "CloverPit_SaveData";

    function saveGameData(data) {
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify(data));
        console.log("[SaveSystem] 데이터 저장 완료:", data);
        document.querySelector("#save-status").textContent = "💾 저장됨: " + new Date().toLocaleTimeString();
      } catch (e) {
        console.error("[SaveSystem] 저장 실패:", e);
      }
    }

    function loadGameData() {
      try {
        const saved = localStorage.getItem(SAVE_KEY);
        if (saved) {
          console.log("[SaveSystem] 저장된 데이터 불러옴:", JSON.parse(saved));
          return JSON.parse(saved);
        }
      } catch (e) {
        console.error("[SaveSystem] 불러오기 실패:", e);
      }
      return null;
    }

    // ============================================================
    // UNITY 로딩 및 실행
    // ============================================================
    const loadingText = document.querySelector("#loading-text");
    const canvas = document.querySelector("#unity-canvas");
    const loadingBar = document.querySelector("#unity-loading-bar");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const warningBanner = document.querySelector("#unity-warning");

    const totalMB = "86.96";
    let loadedBytes = 0;

    function showError(message) {
      console.error("[CloverPit]", message);
      loadingText.textContent = "FAILED TO LOAD";
      loadingText.style.color = "#ff4444";
      unityShowBanner(message, "error");
    }

    async function fetchWithProgress(url) {
      let response;
      try {
        response = await fetch(url);
      } catch (error) {
        throw new Error(`Network error while downloading: ${url}`);
      }

      if (!response.ok) throw new Error(`HTTP ${response.status}: ${url}`);
      if (!response.body) throw new Error(`No response body: ${url}`);

      const reader = response.body.getReader();
      const chunks = [];
      let received = 0;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        if (!value) continue;

        received += value.length;
        loadedBytes += value.length;
        chunks.push(value);

        const mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
        loadingText.textContent = `LOADING... ${mbDone} MB / ${totalMB} MB`;
      }

      const fullBuffer = new Uint8Array(received);
      let offset = 0;
      for (const chunk of chunks) {
        fullBuffer.set(chunk, offset);
        offset += chunk.length;
      }
      return fullBuffer.buffer;
    }

    async function mergeFiles(fileParts, mimeType) {
      const buffers = await Promise.all(fileParts.map(part => fetchWithProgress(part)));
      const mergedBlob = new Blob(buffers, { type: mimeType });
      return URL.createObjectURL(mergedBlob);
    }

    function getParts(file, start, end) {
      const parts = [];
      for (let i = start; i <= end; i++) parts.push(file + ".part" + i);
      return parts;
    }

    function unityShowBanner(msg, type) {
      if (!warningBanner) return;
      warningBanner.innerHTML = msg;
      warningBanner.style.display = "block";
      warningBanner.style.background = type === "error" ? "#ff0000" : (type === "warning" ? "#ffc107" : "#333333");
      warningBanner.style.color = type === "warning" ? "#000000" : "#ffffff";
    }

    (async function () {
      try {
        const dataParts = getParts("Build/CloverPit.data", 1, 3);
        const wasmParts = getParts("Build/CloverPit.wasm", 1, 3);

        const [dataUrl, wasmUrl] = await Promise.all([
          mergeFiles(dataParts, "application/octet-stream"),
          mergeFiles(wasmParts, "application/wasm")
        ]);

        const buildUrl = "Build";
        const loaderUrl = buildUrl + "/CloverPit.loader.js";

        const config = {
          arguments: [],
          dataUrl: dataUrl,
          frameworkUrl: buildUrl + "/CloverPit.framework.js",
          codeUrl: wasmUrl,
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Panik Arcade",
          productName: "CloverPit",
          productVersion: "1.3",
          showBanner: unityShowBanner
        };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          const meta = document.createElement("meta");
          meta.name = "viewport";
          meta.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
          document.getElementsByTagName("head")[0].appendChild(meta);
        }

        loadingBar.style.display = "block";
        const script = document.createElement("script");
        script.src = loaderUrl;

        script.onload = function () {
          createUnityInstance(canvas, config, function (progress) {
            const percent = Math.round(progress * 100);
            progressBarFull.style.width = percent + "%";
            loadingText.textContent = `STARTING GAME... ${percent}%`;
          }).then(function (unityInstance) {
            loadingBar.style.display = "none";
            loadingText.style.display = "none";
            
            // 기존 저장 데이터 불러오기 시도
            loadGameData();
          }).catch(function (error) {
            showError("Unity failed to start.");
          });
        };

        script.onerror = function () {
          showError("Could not load CloverPit.loader.js");
        };

        document.body.appendChild(script);
      } catch (error) {
        showError(error.message || "Unknown loading error.");
      }
    })();
  </script>
</body>
</html>
